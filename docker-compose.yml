services:
  # ==========================================
  # SCRAPE PROFILE
  # ==========================================
  crawler:
    build:
      context: ./crawler
    volumes:
      - ./crawler:/app
      - /app/node_modules
    profiles:
      - scrape
    environment:
      - NODE_ENV=development
      - MAX_PAGES=${MAX_PAGES:-10}

  # ==========================================
  # IMPORT PROFILE
  # ==========================================
  neo4j:
    image: neo4j:5.26.0
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
    profiles:
      - production
      - import

  graph-import:
    build:
      context: ./graph
    volumes:
      - ./crawler/output:/crawler/output:ro
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - GRAPH_JSON_PATH=/crawler/output/graph.json
    depends_on:
      - neo4j
    profiles:
      - import

  # ==========================================
  # PRODUCTION PROFILE
  # ==========================================
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - production

  rag:
    build:
      context: ./rag
    ports:
      - "8000:8000"
    volumes:
      - ./rag:/app
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen3:8b
    depends_on:
      - neo4j
      - ollama
    profiles:
      - production

  interface:
    build:
      context: ./interface
    ports:
      - "3000:3000"
    volumes:
      - ./interface:/app
    depends_on:
      - rag
    profiles:
      - production

volumes:
  ollama_data:
